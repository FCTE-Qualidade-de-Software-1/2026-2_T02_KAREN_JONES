name: Build LaTeX article

on:
  pull_request:
    paths:
      - 'artigo/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile article placeholder
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX placeholder
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: artigo
          root_file: placeholder.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: artigo-placeholder-pdf
          path: artigo/placeholder.pdf
          if-no-files-found: error

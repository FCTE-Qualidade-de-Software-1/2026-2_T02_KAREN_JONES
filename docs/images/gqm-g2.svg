<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1118 568" width="1118" height="568" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Hierarquia GQM do objetivo G2 (Confiabilidade)</title>
<desc id="d">Diagrama em três níveis. Nível conceitual: objetivo G2, entender a confiabilidade do editor, da colaboração e do salvamento do ponto de vista de usuários finais. Nível operacional: 4 questões, uma por subcaracterística. Nível quantitativo: 10 métricas. Q2.1 (Ausência de falhas) é respondida por M2.1.1, M2.1.2, M2.1.3. Q2.2 (Disponibilidade) é respondida por M2.2.1, M2.2.2. Q2.3 (Tolerância a falhas) é respondida por M2.3.1, M2.3.2. Q2.4 (Recuperabilidade) é respondida por M2.4.1, M2.4.2, M2.4.3.</desc>

<text x="631" y="332" font-size="10.5" fill="#334155">Proporção de arquivos</text>
<text x="631" y="345" font-size="10.5" fill="#334155">inválidos tratados com</text>
<text x="631" y="358" font-size="10.5" fill="#334155">mensagem</text>
<rect x="622" y="376" width="170" height="64" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="631" y="393" font-size="12.5" font-weight="700" fill="#0f172a">M2.3.2</text>
<text x="631" y="408" font-size="10.5" fill="#334155">Continuidade do editor após</text>
<text x="631" y="421" font-size="10.5" fill="#334155">falha da colaboração</text>
<rect x="808" y="172" width="200" height="66" rx="10" fill="#047857"/>

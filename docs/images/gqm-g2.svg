<text x="631" y="355" font-size="10.5" fill="#334155">inválidos tratados com</text>
<text x="631" y="368" font-size="10.5" fill="#334155">mensagem</text>
<rect x="622" y="386" width="170" height="64" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>

<text x="415" y="408" font-size="10.5" fill="#334155">Origens externas</text>
<text x="415" y="421" font-size="10.5" fill="#334155">necessárias para o editor</text>
<text x="415" y="434" font-size="10.5" fill="#334155">local</text>
<rect x="592" y="172" width="200" height="66" rx="10" fill="#047857"/>
<text x="692.0" y="199" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Q2.3</text>
<text x="692.0" y="220" text-anchor="middle" font-size="13" fill="#ffffff">Tolerância a falhas</text>
<g stroke="#047857" stroke-width="2" fill="none"><line x1="606" y1="238" x2="606" y2="408.0"/>
<line x1="606" y1="332.0" x2="622" y2="332.0"/>
<line x1="606" y1="408.0" x2="622" y2="408.0"/>
</g>

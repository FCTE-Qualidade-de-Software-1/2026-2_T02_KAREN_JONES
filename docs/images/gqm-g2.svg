<text x="847" y="393" font-size="12.5" font-weight="700" fill="#0f172a">M2.4.2</text>
<text x="847" y="408" font-size="10.5" fill="#334155">Proporção de arquivos</text>
<text x="847" y="421" font-size="10.5" fill="#334155">reabertos sem perda</text>
<rect x="838" y="452" width="170" height="64" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<text x="847" y="469" font-size="12.5" font-weight="700" fill="#0f172a">M2.4.3</text>

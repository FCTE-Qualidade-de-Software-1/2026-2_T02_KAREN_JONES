<text x="584.0" y="80" text-anchor="middle" font-size="12.5" fill="#ffffff">Entender a confiabilidade do editor, da colaboração e do salvamento</text>
<text x="584.0" y="98" text-anchor="middle" font-size="12.5" fill="#ffffff">do ponto de vista de usuários finais</text>
